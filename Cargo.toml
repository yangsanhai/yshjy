[package]
name = "yshjy"
version = "0.9.40"
edition = "2024"
license = "MIT"
authors = ["yangsanhai"]
description = "杨三海解压 —— 把「伪装成视频/图片的压缩包」一键还原成能用的文件"
readme = "README.md"
keywords = ["archive", "extract", "zip", "7z", "rar", "steganography"]
categories = ["command-line-utilities", "compression"]

# 引擎同时要作为**库**被 GUI / 手机端调用（全平台：桌面子进程、iOS 走 FFI）
# rlib   → Rust 内部用（现有测试）
# cdylib → Android / Linux / Windows / macOS 动态库
# staticlib → iOS（App Store 要求静态库，且禁止 fork/exec）
[lib]
name = "yshjy"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
# 默认 = **常用版**：日常下载会遇到的格式全都在，体积小、依赖少、攻击面小
default = []
# **全能版**（`cargo build --release --features full`）：冷门格式挂这里
#
# 加一个新格式的步骤：
#   ① Cargo.toml 里把它的依赖写成 optional = true
#   ② 把依赖名挂进下面这个列表
#   ③ 代码里用 #[cfg(feature = "full")] 写「识别 + 解压」两个分支
#   ④ 打两个包：bash scripts/release.sh
#
# 为什么分档：常用版依赖越少，「某个第三方库被投毒」的风险面越小，
# 而且冷门格式的解析器代码复杂、稳定性差，不该拖累主路径。
full = []

[dependencies]
brotli = "9.0.0"
bzip2-rs = "0.1.2"
ctrlc = "3.4"
encoding_rs = "0.8.42"
filetime = "0.2.29"
flate2 = "1.1.10"
fs4 = "1.1.0"
libc = "0.2.190"
lz4_flex = "0.14.0"
lzma-rs = "0.3.0"
rars = { version = "0.11.0", default-features = false, features = ["encryption", "parallel"] }
ruzstd = "0.9.1"
# tar.zst 的**写入**：ruzstd 只会解压，压缩得用这个（T17-4 打包格式可选）
zstd = { version = "0.13", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.10"
serde_json = "1.0"
sevenz-rust2 = { version = "0.24.0", default-features = false, features = ["aes256", "bzip2", "compress", "ppmd", "util"] }
tar = "0.4.46"
thiserror = "2.0.21"
toml = "1.1.8"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2", "aes-crypto"] }
crossterm = "0.29.0"
unicode-width = "0.2.2"
# --list 的表格：中文按显示宽度对齐、窄终端自动折行（MIT，参考真身 refs/upstream/comfy-table）
# 只多带一个 unicode-segmentation；台账见 docs/REFERENCE-INDEX.md §8
comfy-table = "8"
# --pick 的全屏勾选：raw mode / 分页 / 退出复原这些边界它全覆盖（MIT，真身 refs/upstream/dialoguer）
dialoguer = "0.12"
# -j 2 以上的多行进度：MultiProgress 给每个任务一条独立行（MIT，真身 refs/upstream/indicatif）
indicatif = "0.18"

[dev-dependencies]
rars = { version = "0.11.0", features = ["write", "encryption", "parallel"] }

# Windows 才用的系统 API：时区偏移（crash.rs，W1）、可用内存（外壳探针，W5）。
# 只在 Windows 构建时拉进来 —— Linux/macOS 那半的依赖树与产物一个字节都不变。
# 台账：docs/REFERENCE-INDEX.md §9（API 归属按 windows-sys 0.61 源码核对过）
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation"] }
# 回收站走系统 shell（COM IFileOperation → 资源管理器能还原）：COM 要 unsafe，
# 而 lib 是 forbid(unsafe_code)，自己写不进去（审计 W3 定案；台账 §9 trash-rs）
trash = "5.2"
