# cargo-deny 配置：依赖许可证与安全检查
# 用法：cargo deny check

[graph]
all-features = true

[advisories]
vulnerability = "deny"
unmaintained = "warn"
yanked = "deny"

[licenses]
# 只允许这些开源许可证（与本项目 MIT 兼容）
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
