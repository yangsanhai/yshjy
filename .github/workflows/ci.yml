name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: 格式 / 静态检查 / 测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: 缓存
        uses: Swatinem/rust-cache@v2

      - name: 格式检查（只提示，不阻塞）
        # 项目用手写紧凑风格 + 中文标识符，rustfmt 会把上千行重排（本机实测差异 4223 行）。
        # 本地门禁里这条也只记提示（tests/all.sh 里不判红）；写成硬门禁会让每次 CI 都红，
        # 红久了就没人看，这条护栏也就废了。
        run: |
          if cargo fmt --all -- --check > fmt-report.txt 2>&1; then
            echo "格式干净"
          else
            echo "::warning::cargo fmt 有差异（不阻塞构建），前 30 行："
            head -30 fmt-report.txt
          fi

      - name: 静态检查
        run: cargo clippy --all-targets -- -D warnings

      - name: 构建
        run: cargo build --release

      - name: 测试
        run: cargo test --all

  licenses:
    name: 依赖许可证审计
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: 安装 cargo-deny
        uses: taiki-e/install-action@cargo-deny
      - name: 检查许可证
        run: cargo deny check licenses

  gui:
    # 界面以前完全不在 CI 里：Rust 侧挂了会红，dart 侧挂了没人知道。
    # 这里只跑 analyze + test（两者都不需要 GTK/显示服务），
    # 出包流水线（deb/AppImage + tag 发布）另算，见 TODO T12。
    name: 界面（flutter analyze + test）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Flutter（钉住开发机同版本）
        # 版本不一致会让 lint 规则和渲染结果都漂：本地 3.44.9 全绿，CI 换个大版本就可能在
        # 无关的地方冒出新信息。升级本地时记得同步改这里。
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.9
          channel: stable
          cache: true

      - name: 版本
        run: flutter --version

      - name: 依赖
        working-directory: gui
        run: flutter pub get

      - name: 静态检查
        # 注意：项目里还有 1 条既有 info（不在本轮范围内），
        # 所以这里**不加** --fatal-infos，否则一上来就红、没人会去修。
        working-directory: gui
        run: flutter analyze

      - name: 测试
        working-directory: gui
        # 两个 XDG 都要指到临时目录：只设 CONFIG 时，有几条共用状态目录的用例会互相踩，
        # 报一条 config.toml 断言红、而单跑那条是绿的（假失败）。
        # YSHJY_SKIP_GOLDEN=1：金标是像素比对，runner 的中文字体与渲染栈和开发机不保证一致，
        # 跨环境比只会变成假红；金标由开发机负责（各平台存各自的基准图）。
        env:
          XDG_CONFIG_HOME: /tmp/yshjy-ci-config
          XDG_STATE_HOME: /tmp/yshjy-ci-state
          YSHJY_SKIP_GOLDEN: "1"
        run: mkdir -p /tmp/yshjy-ci-config /tmp/yshjy-ci-state && flutter test
