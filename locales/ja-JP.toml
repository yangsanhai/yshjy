formats = "  対応形式：ZIP（分割対応）/ 7z / RAR / TAR / gzip / xz / zstd / bzip2 / brotli / lz4"
tier_common = "  常用版：普段出会う形式はすべて対応（サイズが小さく、依存も少なめ）"
tier_full = "  全能版：珍しい形式（ISO/UDF、CAB、ARJ など）を順次追加中。現在は常用版と同じ範囲"

