# 日本語 —— yshjy 言語パック
#
# ══════════════════════════════════════════════════════════════
#  新しい言語を追加したい？ コードを書かずに 3 ステップ：
#    ① このファイルをコピーして言語コードに改名（例：fr-FR.toml）
#    ② [meta] の code / name を自分の言語に変更
#    ③ 各 `=` の右側を翻訳する
#
#  一部だけ上書きしたい場合は ~/.config/yshjy/locales/xx-XX.toml を置き、
#  **書きたい項目だけ**書けば残りは内蔵パックが使われます。
#
#  {name} のような波括弧はプレースホルダです。そのまま残してください。
# ══════════════════════════════════════════════════════════════

[meta]
code = "ja-JP"
name = "日本語"
translators = "yshjy プロジェクト"

[help]
text = """
yshjy（楊三海解圧） —— 「動画のふりをした圧縮ファイル」を一発で展開

使い方：
  yshjy <ファイル>                 展開（既定）
  yshjy jy <ファイル>              展開（明示的な書き方、スクリプト向け）
  yshjy ys <ファイル/フォルダ>      偽装ファイルに固める
  yshjy --list <ファイル>          中身を見るだけ（展開しない）
  yshjy --rescue <ファイル>        壊れた圧縮ファイルから可能な限り救出
  yshjy --extract-cover <ファイル>  偽装パッケージ内の元動画/画像だけを取り出す（解凍しない）
  yshjy --help                     このヘルプ
  yshjy --report <ファイル>        診断パッケージを作成（--no-paths でパスを伏せる）
  --split <サイズ>                分割して出力（例: 2G / 500M。バイト数だけでも可）
  --no-checksum                   .sha256 を生成しない（既定は生成）
  --no-readme                     説明.txt を生成しない（既定は生成）
  --encoding <名前>              ファイル名の文字コードを指定（auto / gbk / big5 / sjis / utf-8。gb18030・shift-jis は別名）
  yshjy -V, --version              バージョンとエディション（常用版 / 全能版）

よく使うオプション：
  -o, --dest <フォルダ>            展開先（既定：アーカイブのある場所に同じ名前のフォルダ）
  -p, --password <パスワード>      展開／圧縮のパスワード
  -j, --jobs <N>                   同時に処理する数（既定 1、ディスクに優しい）
  --select <条件>                  一部だけ展開：
                                    --select "*.exe"       .exe だけ
                                    --select "data/**"     そのフォルダ以下だけ
                                    --select "1,3,5"       1・3・5 番目だけ
                                    --select required      .DS_Store などを除外
  --candidate <位置>              1 ファイルに複数のアーカイブが隠れているとき、どれを展開するか指定（位置＝スキャン結果のバイト数）
  --pick <ファイル>               展開する項目を全画面で選ぶ（スペース · a · Enter）
  --json                           イベント／結果を JSON 行で出力（スクリプト向け）
  --no-smart-dir                   「スマート展開」を無効化：既定では最上位フォルダが 1 つだけなら
                                   同名フォルダを重ねず展開先へ直接展開します
  -q, --quiet                      結果だけ出力（スクリプト向け）
  --force 展開前のディスク容量チェックを飛ばす（足りないと開始を拒否します）
  --test  検証のみ：完全にデコードして検査し、何も書き込みません（壊れていないかの確認用）
  --lang <言語>                    表示言語を切り替え（例：zh-CN、en、ko、ru、es）
  --show-config 現在の設定を表示（設定ファイルの場所と各項目の値）
  --tail                           末尾追加レイアウトで固める（既定：free アトム内。表紙が画像/テキストなら自動）
  --config <ファイル>             設定ファイルを指定（既定: ~/.config/yshjy/config.toml）
  --layout L1|L2|L4               パック配置：L1 末尾追加 / L2 free アトム（既定）/
                                   L4 動画の途中に挿入（再生できるが、7-Zip と本ツールでしか見つからない）
  --cover <ファイル>              自作の画像/動画をカバーに使う
  --password-file <ファイル>      パスワード一覧（1 行 1 個、# はコメント）
  --no-auto-password              説明ファイルや一覧からパスワードを探さない
  --no-auto-password-notes        「説明.txt から拾う」のだけ止める
  --no-auto-password-book         自分のパスワード一覧を試すのだけ止める
  --import-passwords <ファイル>   パスワード一覧を取り込む（1行1個、# は行コメント。Tab 区切りは1列目を使い、重複は自動で除去）
  -v, -vv, --verbose              詳細 / デバッグ出力（-vv はより詳細。--log と併用）
  --log <ファイル>                ログをファイルに書く（不具合報告用）
  --no-color                      色を付けない（パイプ/ログ向け）
  --keep                          パック時の一時 ZIP を残す（調査用）
  --trash-source                  解凍後に元のアーカイブをゴミ箱へ移動（復元できます）
  --delete-source                 解凍後に元のアーカイブを完全削除（元に戻せません。1 回確認し、非対話では拒否します）
  --format <形式>                 通常アーカイブとして固める（カバーなし）：zip / tar.gz / tar.zst。指定すると通常圧縮、未指定なら従来どおり偽装パッケージ
  --name <名前>                   出力ファイル名を変更（例: 映画.2026.1080p.mp4）。置き場所は -o で指定
  --tweak-time                    重複判定よけ：エントリの時刻を毎回ばらす（クラウドが同一ファイルと見なさない）。既定はオフ
  --level 0-9                     パック時の圧縮レベル：0 = 無圧縮（最速）、9 = 最小サイズ（既定 6）
  --sfx / --sfx-linux             自己解凍アーカイブ（.exe / .sh）。--split とは併用不可、--cover 不要、説明.txt は作りません
  --decoy <N>                     パックにダミーデータを N 個入れる（最大 64、既定 0 = なし）
  --decoy-size <サイズ>           1 個あたりの大きさ（4K–1M、既定 16K）
  --decoy-signatures              各ダミーに偽の書庫シグネチャを入れる（既定オフ）
  --caps                          形式ごとの対応表（解凍 / パック / 暗号化 / 分割 / 再開）を表示

例：
  yshjy movie.mp4                 動画に隠された圧縮ファイルを展開
  yshjy downloads/                フォルダ内を順番に処理（1 つ失敗しても続行）
  yshjy --list movie.mp4          中身を確認
  yshjy --select "*.exe" game.mp4 .exe だけ取り出す
  yshjy -p "パスワード" game.mp4   パスワード付きで展開
  yshjy ys my-game/               フォルダを偽装動画に固める
  yshjy --rescue broken.zip       壊れた圧縮ファイルから救出
  yshjy --json pack.mp4 | jq .    スクリプトやフロントエンドへ

開けない？ まず `yshjy --list` で中身を判別できるか試してください。
"""

