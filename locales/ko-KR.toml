# 한국어 —— yshjy 언어 팩
#
# ══════════════════════════════════════════════════════════════
#  새 언어를 추가하려면? 코딩 없이 3단계:
#    ① 이 파일을 복사해 언어 코드로 이름 변경 (예: fr-FR.toml)
#    ② [meta] 의 code / name 을 자신의 언어로 변경
#    ③ 각 `=` 오른쪽을 번역
#
#  일부만 덮어쓰려면 ~/.config/yshjy/locales/xx-XX.toml 을 두고
#  **바꿀 항목만** 적으면 나머지는 내장 팩을 사용합니다.
#
#  {name} 같은 중괄호는 자리표시자입니다. 그대로 두세요.
# ══════════════════════════════════════════════════════════════

[meta]
code = "ko-KR"
name = "한국어"
translators = "yshjy 프로젝트"

[help]
text = """
yshjy(楊三海解壓) —— '동영상으로 위장한 압축 파일'을 한 번에 푸는 도구

사용법:
  yshjy <파일>                    압축 풀기 (기본)
  yshjy jy <파일>                 압축 풀기 (명시적 표기, 스크립트에 적합)
  yshjy ys <파일/폴더>            위장 파일로 묶기
  yshjy --list <파일>             안을 보기만 하기 (풀지 않음)
  yshjy --rescue <파일>           손상된 압축 파일에서 최대한 복구
  yshjy --extract-cover <파일>    위장 패키지의 원본 영상/이미지만 추출 (압축 해제 안 함)
  yshjy --help                    이 도움말
  yshjy --report <파일>           진단 패키지 생성 (--no-paths는 경로를 숨김)
  --split <크기>                  분할 출력 (예: 2G / 500M, 순수 바이트 수도 가능)
  --no-checksum                   .sha256 생성 안 함 (기본 생성)
  --no-readme                     说明.txt 생성 안 함 (기본 생성)
  --encoding <이름>              파일명 인코딩 지정 (auto / gbk / big5 / sjis / utf-8; gb18030, shift-jis 는 별칭)
  yshjy -V, --version             버전과 에디션 (common / full)

자주 쓰는 옵션:
  -o, --dest <폴더>               압축을 풀 위치 (기본: 압축 파일 옆의 같은 이름 폴더)
  -p, --password <비밀번호>       압축 풀기/묶기 비밀번호
  -j, --jobs <N>                  동시에 처리할 개수 (기본 1, 디스크에 부담이 적음)
  --select <조건>                 일부만 풀기:
                                    --select "*.exe"      .exe만
                                    --select "data/**"    해당 폴더 아래만
                                    --select "1,3,5"      1·3·5번째만
                                    --select required      .DS_Store 같은 쓰레기 제외
  --candidate <오프셋>            한 파일에 여러 아카이브가 숨어 있을 때 어느 것을 풀지 지정 (오프셋 = 스캔 결과의 바이트 수)
  --pick <파일>                   풀 항목을 전체 화면에서 선택 (스페이스 · a · Enter)
  --json                          이벤트/결과를 JSON 줄로 출력 (스크립트용)
  --no-smart-dir                  '스마트 압축 풀기' 해제: 기본값은 최상위 폴더가 하나뿐이면
                                  같은 이름의 폴더를 겹치지 않고 대상 폴더에 바로 풉니다
  -q, --quiet                     결과만 출력 (스크립트용)
  --force 압축 풀기 전 디스크 공간 점검 건너뛰기 (부족하면 시작을 거부)
  --test  검증만: 완전히 디코드·검사만 하고 아무것도 쓰지 않습니다 (패키지 무결성 확인용)
  --lang <언어>                   인터페이스 언어 변경 (예: zh-CN, en, ja, ru, es)
  --show-config 현재 설정 보기 (설정 파일 위치와 각 항목 값)
  --tail                          '끝에 덧붙이기' 레이아웃으로 묶기 (기본: free atom 안, 표지가 그림/텍스트면 자동)
  --config <파일>                 설정 파일 지정 (기본: ~/.config/yshjy/config.toml)
  --layout L1|L2|L4               패키지 배치: L1 끝에 추가 / L2 free atom (기본) /
                                   L4 영상 중간에 삽입 (재생은 되지만 7-Zip 과 이 도구만 찾을 수 있음)
  --cover <파일>                  직접 만든 이미지/영상을 표지로 사용
  --password-file <파일>          비밀번호 목록 (한 줄에 하나, # 주석)
  --no-auto-password              설명 파일/목록에서 비밀번호를 자동으로 찾지 않음
  --no-auto-password-notes        「설명.txt에서 찾기」만 끄기
  --no-auto-password-book         내 비밀번호 목록 시도만 끄기
  --import-passwords <파일>       비밀번호 목록 가져오기 (한 줄에 하나, # 은 주석; Tab 구분 시 첫 열 사용, 중복 자동 제거)
  -v, -vv, --verbose              상세 / 디버그 출력 (-vv 는 더 자세히, --log 와 함께)
  --log <파일>                    로그를 파일로 저장 (버그 신고용)
  --no-color                      색상 없이 출력 (파이프/로그용)
  --keep                          패키징 중간 ZIP 보관 (조사용)
  --trash-source                  압축을 푼 뒤 원본 압축 파일을 휴지통으로 이동 (복원 가능)
  --delete-source                 압축을 푼 뒤 원본 압축 파일을 영구 삭제 (복구 불가, 한 번 확인하며 비대화형에서는 거부)
  --format <형식>                 일반 압축 파일로 묶기(겉포장 없음): zip / tar.gz / tar.zst. 지정하면 일반 압축, 생략하면 기존처럼 위장 패키지
  --name <이름>                   출력 파일 이름 변경 (예: 영화.2026.1080p.mp4). 위치는 -o 로 지정
  --tweak-time                    중복 판정 회피: 항목 시간을 매번 무작위로(클라우드가 같은 파일로 보지 않게). 기본 꺼짐
  --level 0-9                     패킹 압축 수준: 0 = 저장(가장 빠름), 9 = 최소 크기 (기본 6)
  --sfx / --sfx-linux             자동 압축 풀림 파일(.exe / .sh). --split 과 함께 쓸 수 없고 --cover 도 불필요, .설명.txt 는 만들지 않음
  --decoy <N>                     팩에 방해 데이터를 N개 넣기 (최대 64, 기본 0 = 사용 안 함)
  --decoy-size <크기>             조각당 크기 (4K–1M, 기본 16K)
  --decoy-signatures              각 조각에 가짜 압축 시그니처 넣기 (기본 꺼짐)
  --caps                          형식별 지원표(해제 / 패킹 / 암호화 / 분할 / 이어받기) 보기

예시:
  yshjy movie.mp4                 동영상 속에 숨은 압축 파일 풀기
  yshjy downloads/                폴더 안의 압축 파일을 차례로 처리 (하나 실패해도 계속)
  yshjy --list movie.mp4          안에 뭐가 있는지 확인
  yshjy --select "*.exe" game.mp4 .exe만 추출
  yshjy -p "비밀번호" game.mp4     비밀번호로 압축 풀기
  yshjy ys my-game/               폴더를 위장 동영상으로 묶기
  yshjy --rescue broken.zip       손상된 압축 파일에서 복구
  yshjy --json pack.mp4 | jq .    스크립트/프런트엔드로 전달

안 열리나요? 먼저 `yshjy --list` 로 안에 무엇이 있는지 확인해 보세요.
"""

[tier]
common = "common 에디션"
full = "full 에디션"

[version]
line = "yshjy {version} ({tier}) —— 楊三海解壓"
formats = "  지원 형식: ZIP(분할 포함) / 7z / RAR / TAR / gzip / xz / zstd / bzip2 / brotli / lz4"
tier_common = "  common 에디션: 실생활에서 만나는 형식은 모두 지원 (크기가 작고 의존성도 적음)"
tier_full = "  full 에디션: 드문 형식(ISO/UDF, CAB, ARJ 등)을 순차 추가 중. 현재는 common과 동일"

