# Русский —— языковой пакет yshjy
#
# ══════════════════════════════════════════════════════════════
#  Хотите добавить новый язык? Три шага, без программирования:
#    ① Скопируйте этот файл и переименуйте в код языка (например, fr-FR.toml)
#    ② Измените code / name в [meta]
#    ③ Переведите текст справа от каждого `=`
#
#  Нужно переопределить лишь несколько строк? Положите файл
#  ~/.config/yshjy/locales/xx-XX.toml — остальное возьмётся из встроенного пакета.
#
#  Плейсхолдеры вида {name} оставляйте как есть.
# ══════════════════════════════════════════════════════════════

[meta]
code = "ru-RU"
name = "Русский"
translators = "проект yshjy"

[help]
text = """
yshjy — инструмент для «видео», которые на самом деле являются архивами

ИСПОЛЬЗОВАНИЕ:
  yshjy <файл>                    распаковать (по умолчанию)
  yshjy jy <файл>                 распаковать (явная форма, удобна в скриптах)
  yshjy ys <файл или папка>       упаковать в замаскированный файл
  yshjy --list <файл>             показать содержимое, не распаковывая
  yshjy --rescue <файл>           вытащить максимум из повреждённого архива
  yshjy --extract-cover <файл>    извлечь только исходное видео/изображение (без распаковки)
  yshjy --help                    эта справка
  yshjy --report <файл>           создать диагностический пакет (--no-paths скрывает пути)
  --split <размер>                разбить на части (напр. 2G / 500M; можно число байт)
  --no-checksum                   не создавать .sha256 (по умолчанию создаётся)
  --no-readme                     не создавать 说明.txt (по умолчанию создаётся)
  --encoding <имя>               принудительная кодировка имён (auto / gbk / big5 / sjis / utf-8; gb18030 и shift-jis — синонимы)
  yshjy -V, --version             версия и редакция (обычная / полная)

ОСНОВНЫЕ ОПЦИИ:
  -o, --dest <каталог>            куда распаковать (по умолчанию: папка с тем же именем рядом с архивом)
  -p, --password <пароль>         пароль для распаковки / упаковки
  -j, --jobs <N>                  сколько архивов обрабатывать одновременно (по умолчанию 1)
  --select <правило>              распаковать только часть:
                                    --select "*.exe"     только .exe
                                    --select "data/**"   только это поддерево
                                    --select "1,3,5"     только записи №1, №3 и №5
                                    --select required    пропустить мусор вроде .DS_Store
  --candidate <смещение>          в файле спрятано несколько архивов: указать, какой распаковать (смещение — число из сканирования)
  --pick <файл>                   выбрать элементы в полноэкранном списке (пробел · a · Enter)
  --json                          выводить события и результаты строками JSON (для скриптов)
  --no-smart-dir                  отключить «умную распаковку»: по умолчанию, если в архиве одна
                                  корневая папка, файлы распаковываются прямо в каталог назначения
  -q, --quiet                     выводить только результат (для скриптов)
  --force пропустить проверку свободного места (иначе при нехватке запуск отменяется)
  --test  Только проверка: полное декодирование и контроль без записи (проверить целостность архива)
  --lang <язык>                   сменить язык интерфейса (например: zh-CN, en, ja, ko, es)
  --show-config показать текущую конфигурацию (где файл и какие значения)
  --tail                          упаковать «добавлением в конец» (по умолчанию: внутрь free-атома; для обложки-картинки/текста включается само)
  --config <файл>                 указать файл настроек (по умолчанию: ~/.config/yshjy/config.toml)
  --layout L1|L2|L4               раскладка: L1 дописать в конец / L2 внутри free-атома (по умолчанию) /
                                   L4 в середине видео (играет, но архив видят только 7-Zip и этот инструмент)
  --cover <файл>                  своя обложка (картинка/видео)
  --password-file <файл>          список паролей (по одному в строке, # — комментарий)
  --no-auto-password              не искать пароль в описании и списке
  --no-auto-password-notes        не искать пароли только в заметках рядом
  --no-auto-password-book         не пробовать только свой список паролей
  --import-passwords <файл>       импорт списка паролей (по одному в строке, # — комментарий; при табуляции берётся 1-й столбец, дубликаты удаляются)
  -v, -vv, --verbose              подробный / отладочный вывод (-vv подробнее, вместе с --log)
  --log <файл>                    писать лог в файл (для отчёта об ошибке)
  --no-color                      без цвета (для конвейера/логов)
  --keep                          сохранить промежуточный ZIP при упаковке
  --trash-source                  после распаковки переместить исходный архив в корзину (можно восстановить)
  --delete-source                 после распаковки удалить исходный архив навсегда (необратимо; спросит один раз, в неинтерактивном режиме откажет)
  --format <формат>               Упаковать в обычный архив (без обложки): zip / tar.gz / tar.zst. Указан = обычная упаковка; не указан = маскировка, как раньше
  --name <имя>                    переименовать выходной файл (напр. Фильм.2026.1080p.mp4); папка задаётся через -o
  --tweak-time                    Против дедупликации: перемешивает время записей (каждый раз разное), чтобы облако не считало файл тем же; по умолчанию выкл.
  --level 0-9                     уровень сжатия при упаковке: 0 = без сжатия (быстро), 9 = минимальный размер (по умолчанию 6)
  --sfx / --sfx-linux             упаковать в самораспаковывающийся архив (.exe / .sh); нельзя с --split, --cover не нужен, .описание.txt не создаётся
  --decoy <N>                     Добавить N сегментов мусорных данных (макс. 64, по умолчанию 0 = выкл)
  --decoy-size <размер>           Размер одного сегмента (4K–1M, по умолчанию 16K)
  --decoy-signatures              Вставить фальшивую сигнатуру архива в каждый сегмент (по умолчанию выкл)
  --caps                          показать таблицу возможностей по форматам (распаковка / упаковка / шифрование / тома / докачка)

ПРИМЕРЫ:
  yshjy movie.mp4                 распаковать архив, спрятанный в видео
  yshjy downloads/                обработать все архивы в папке (сбой одного не остановит остальные)
  yshjy --list movie.mp4          посмотреть, что внутри
  yshjy --select "*.exe" game.mp4 только .exe
  yshjy -p "пароль" game.mp4      распаковать с паролем
  yshjy ys my-game/               упаковать папку в замаскированное видео
  yshjy --rescue broken.zip       вытащить данные из повреждённого архива
  yshjy --json pack.mp4 | jq .    передать в скрипт или интерфейс

Не открывается? Сначала выполните `yshjy --list`, чтобы проверить, распознаётся ли содержимое.
"""

