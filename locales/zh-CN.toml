# 简体中文 —— yshjy 语言包
#
# ══════════════════════════════════════════════════════════════
#  想加一种新语言？三步，不用会编程、不用碰代码：
#    ① 复制本文件，改名成语言代码（如 fr-FR.toml、de-DE.toml）
#    ② 把 [meta] 的 code / name 换成你的语言
#    ③ 逐条把等号右边的文字翻译过去
#
#  只想改几条？放一份 ~/.config/yshjy/locales/你的语言.toml，
#  里面**只写要覆盖的条目**，其余会自动用内置的。
#
#  注意：{name} 这种花括号是占位符，翻译时要原样保留。
# ══════════════════════════════════════════════════════════════

[meta]
code = "zh-CN"
name = "简体中文"
translators = "yshjy 项目组"

[help]
text = """
杨三海解压（yshjy） —— 专治「伪装成视频/图片的压缩包」

用法：
  yshjy <文件>                    解压（默认）
  yshjy jy <文件>                 解压（写法完整，脚本推荐）
  yshjy ys <文件或文件夹>          打包成伪装文件
  yshjy --list <文件>             先看看里面有什么（不解压）
  yshjy --rescue <文件>           文件坏了也尽量救出来
  yshjy --help                    看这份帮助
  yshjy -V, --version             看版本和档位（常用版 / 全能版）

常用选项：
  -o, --dest <目录>               解压到哪（默认：当前目录下的同名文件夹）
  -p, --password <密码>           解压码 / 打包密码
  -j, --jobs <N>                  同时跑几个（默认 1，按顺序来最省磁盘）
  --select <条件>                 只解一部分：
                                    --select "*.exe"      只要 exe
                                    --select "游戏数据/**" 只要某个目录
                                    --select "1,3,5"      只要第 1、3、5 个
                                    --select required     跳过 .DS_Store 之类的垃圾
  --json                          按行输出事件流/结果（给脚本用）
  --no-smart-dir                  关掉「智能解压」：默认会看包里有没有单一顶层目录来决定
                                  要不要多套一层同名文件夹，加这个就永远建同名文件夹
  -q, --quiet                     只输出结果（脚本用）
  --lang <语言>                   切换界面语言（如 en、ja、ko、ru、es）
  --tail                          打包用"尾部追加"布局（默认藏进 free 原子）

例子：
  yshjy 示例视频.mp4            解开藏在视频里的压缩包
  yshjy 下载/                     整个目录里的包排队解（一个坏了不影响其余）
  yshjy --list 电影.mp4           只看里面有什么
  yshjy --select "*.exe" 游戏.mp4  只要里面的 exe
  yshjy -p "解压码" 游戏.mp4       带解压码解压
  yshjy ys 我的游戏/               把文件夹打包成伪装视频
  yshjy --rescue 坏了的.zip        文件坏了也尽量救
  yshjy --json 包.mp4 | jq .       给脚本/前端消费

解不开？先试 yshjy --list 看能不能认出里面有什么。
"""

[tier]
common = "常用版"
full = "全能版"

[version]
line = "yshjy {version}（{tier}）—— 杨三海解压"
formats = "  支持的格式：ZIP（含分卷）/ 7z / RAR / TAR / gzip / xz / zstd / bzip2 / brotli / lz4"
tier_common = "  常用版：日常下载会遇到的格式全都在（体积更小、依赖更少）"
tier_full = "  全能版：冷门格式（ISO/UDF、CAB、ARJ…）陆续补进来，当前覆盖与常用版一致"

[preview]
title = "📦 {input}（{format}）"
incomplete = "   ⚠ 这个格式只能列出部分信息（大小未知）"
empty = "   （列不出内容）"
row = "   {lock}{icon} {index:>4}.  {size:>10}  {path}{risk}"
row_more = "   … 还有 {count} 个"
total = "   合计 {size} / {count} 个文件"
password_hint = "   解压码：看旁边的「说明.txt」，或 yshjy -p \"解压码\" \"{input}\""
select_hint = "   只解一部分：yshjy --select \"1,3\" \"{input}\""
risky = " ⚠可执行"
unknown_size = "—"

[preview.hint]
volumes_merged = "检测到 {count} 个分卷，解压时会自动拼起来"
nested_archive = "里面还套了一层压缩包（{inner}）"
needs_password = "其中 {count} 个带锁 —— 解压需要解压码"
looks_truncated = "这个包可能没下完（尾部数据缺失）"
hidden_at = "包藏在文件中间（偏移 {offset}），已按真实位置定位"
rebuilt_index = "索引坏了，清单是按文件头重建的"
video_unplayable = "封面视频本身有问题，但里面的文件还能解"

[result]
ok = "✅ {input} —— 解开（{size}，用时 {secs} 秒）"
partial = "⚠ {input} —— 解了一部分（成功 {done} 个，跳过 {skipped} 个）"
failed = "❌ {input} —— 没解开：{reason}"
cancelled = "⏹ {input} —— 已取消（已解出的文件保留）"

[error]
not_archive = "这不是压缩包（没找到可识别的压缩数据）"
password_wrong = "解压码不对"
password_missing = "这个包带锁，需要解压码"
path_not_found = "找不到文件或目录"
no_space = "磁盘空间不够"
cancel = "已取消"
corrupt = "文件损坏或数据不完整"
unsupported = "这个格式暂时解不了"
internal = "内部错误"

[misc]
file_missing = "❌ {input}：文件不存在"
lang_unknown = "⚠ 没有 \"{lang}\" 这个语言包，改用 {fallback}（可用：{available}）"
lang_switched = "界面语言：{name}（{code}）"
