# 简体中文 —— yshjy 语言包
#
# ══════════════════════════════════════════════════════════════
#  想加一种新语言？三步，不用会编程、不用碰代码：
#    ① 复制本文件，改名成语言代码（如 fr-FR.toml、de-DE.toml）
#    ② 把 [meta] 的 code / name 换成你的语言
#    ③ 逐条把等号右边的文字翻译过去
#
#  只想改几条？放一份 ~/.config/yshjy/locales/你的语言.toml，
#  里面**只写要覆盖的条目**，其余会自动用内置的。
#
#  注意：{name} 这种花括号是占位符，翻译时要原样保留。
# ══════════════════════════════════════════════════════════════

[meta]
code = "zh-CN"
name = "简体中文"
translators = "yshjy 项目组"

[help]
text = """
杨三海解压（yshjy） —— 专治「伪装成视频/图片的压缩包」

用法：
  yshjy <文件>                    解压（默认）
  yshjy jy <文件>                 解压（写法完整，脚本推荐）
  yshjy ys <文件或文件夹>          打包成伪装文件
  yshjy --list <文件>             先看看里面有什么（不解压）
  yshjy --rescue <文件>           文件坏了也尽量救出来
  yshjy --extract-cover <文件>    只把伪装包里的原版视频/图片拿出来（不解压）
  yshjy --help                    看这份帮助
  yshjy -V, --version             看版本和档位（常用版 / 全能版）

常用选项：
  -o, --dest <目录>               解压到哪（默认：包所在目录下的同名文件夹）
  -p, --password <密码>           解压码 / 打包密码
  -j, --jobs <N>                  同时跑几个（默认 1，按顺序来最省磁盘）
  --select <条件>                 只解一部分：
                                    --select "*.exe"      只要 exe
                                    --select "游戏数据/**" 只要某个目录
                                    --select "1,3,5"      只要第 1、3、5 个
                                    --select required     跳过 .DS_Store 之类的垃圾
  --pick <文件>                   全屏勾选要解哪些（↑↓ 选 · 空格勾 · a 全选 · Enter 确认）
  --json                          按行输出事件流/结果（给脚本用）
  --no-smart-dir                  关掉「智能解压」：默认会看包里有没有单一顶层目录来决定
                                  要不要多套一层同名文件夹，加这个就永远建同名文件夹
  -q, --quiet                     只输出结果（脚本用）
  --force                         跳过解压前的磁盘空间预检（空间不够时会直接拒绝开始）
  --test                          只测不写：完整解码 + 校验，一个字节都不落盘（查包完不完整用）
  --lang <语言>                   切换界面语言（如 en、ja、ko、ru、es）
  --show-config                   看当前配置（配置文件在哪、各项现在是什么值）
  --import-passwords <文件>       导入密码本（每行一个解压码，# 开头是注释；Tab 分隔取第一列，自动去重）
  yshjy --report [包]             生成诊断包（报障用；加 --no-paths 脱敏路径）
  --split <大小>                  打包时分卷（如 2G / 500M，也认纯字节数）
  --no-checksum                   不生成 .sha256 校验和（默认生成）
  --no-readme                     不生成 .说明.txt（默认生成）
  --encoding <编码>              手动指定文件名编码（auto / gbk / big5 / sjis / utf-8；gb18030、shift-jis 是别名）
  --tail                          打包用"尾部追加"布局（默认藏进 free 原子；封面是图片/文字时自动用它）
  --config <文件>                 用指定的配置文件（默认 ~/.config/yshjy/config.toml）
  --layout L1|L2                  打包布局：L1 尾部追加 / L2 藏进 free 原子（默认）
  --cover <文件>                  用自己的图片/视频当封面（默认用内置素材）
  --password-file <文件>          密码本：每行一个（# 注释），只对这次命令有效
  --no-auto-password              不自动从「说明.txt」和密码本找解压码
  -v, -vv, --verbose              详细 / 调试输出（-vv 更详细；配合 --log 排错）
  --log <文件>                    把日志写进文件（报错时发给开发者）
  --no-color                      不上色（管道 / 日志友好）
  --keep                          打包时保留中间 ZIP（排错用）
  --trash-source                  解完把原包移进回收站（能还原）
  --delete-source                 解完永久删除原包（不可恢复；会先问一次，非交互直接拒绝）
  --level 0-9                     打包压缩级别：0 = 仅存储（最快），9 = 最小体积（默认 6）
  --sfx / --sfx-linux             打包成自解压包（.exe / .sh），双击自己解开；不能与 --split 同用、不用 --cover，这种包不生成 .说明.txt
  --decoy <N>                     打包时撒 N 段干扰数据（最多 64 段，默认 0 = 不打）
  --decoy-size <大小>             每段多大（4K–1M，默认 16K）
  --decoy-signatures              每段里夹一枚假特征码（骗扫描器；默认关）
  --caps                          看各格式的能力表（能解 / 能打包 / 加密 / 分卷 / 续传）

例子：
  yshjy 示例视频.mp4            解开藏在视频里的压缩包
  yshjy 下载/                     整个目录里的包排队解（一个坏了不影响其余）
  yshjy --list 电影.mp4           只看里面有什么
  yshjy --select "*.exe" 游戏.mp4  只要里面的 exe
  yshjy -p "解压码" 游戏.mp4       带解压码解压
  yshjy ys 我的游戏/               把文件夹打包成伪装视频
  yshjy --rescue 坏了的.zip        文件坏了也尽量救
  yshjy --json 包.mp4 | jq .       给脚本/前端消费

解不开？先试 yshjy --list 看能不能认出里面有什么。
"""

