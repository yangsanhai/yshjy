# Español —— paquete de idioma de yshjy
#
# ══════════════════════════════════════════════════════════════
#  ¿Quieres añadir un idioma nuevo? Tres pasos, sin programar:
#    ① Copia este archivo y renómbralo al código del idioma (p. ej. fr-FR.toml)
#    ② Cambia code / name en [meta]
#    ③ Traduce el texto a la derecha de cada `=`
#
#  ¿Solo quieres cambiar unas líneas? Coloca
#  ~/.config/yshjy/locales/xx-XX.toml — lo que omitas se toma del paquete integrado.
#
#  Mantén los marcadores como {name} tal cual.
# ══════════════════════════════════════════════════════════════

[meta]
code = "es-ES"
name = "Español"
translators = "proyecto yshjy"

[help]
text = """
yshjy — la herramienta para «vídeos» que en realidad son archivos comprimidos

USO:
  yshjy <archivo>                 extraer (por defecto)
  yshjy jy <archivo>              extraer (forma explícita, ideal para scripts)
  yshjy ys <archivo o carpeta>    empaquetar en un archivo camuflado
  yshjy --list <archivo>          ver el contenido sin extraer
  yshjy --rescue <archivo>        rescatar lo máximo posible de un archivo dañado
  yshjy --extract-cover <archivo> extraer solo el vídeo/imagen original (sin descomprimir)
  yshjy --help                    esta ayuda
  yshjy --report <archivo>        crear un paquete de diagnóstico (--no-paths oculta rutas)
  --split <tamaño>                dividir el paquete (ej. 2G / 500M; también acepta bytes)
  --no-checksum                   no generar .sha256 (se genera por defecto)
  --no-readme                     no generar 说明.txt (se genera por defecto)
  --encoding <nombre>            forzar codificación de nombres (auto / gbk / big5 / sjis / utf-8; gb18030 y shift-jis son alias)
  yshjy -V, --version             versión y edición (común / completa)

OPCIONES HABITUALES:
  -o, --dest <carpeta>            dónde extraer (por defecto: carpeta con el mismo nombre junto al archivo)
  -p, --password <clave>          contraseña para extraer / empaquetar
  -j, --jobs <N>                  cuántos a la vez (por defecto 1; secuencial es más suave con el disco)
  --select <regla>                extraer solo una parte:
                                    --select "*.exe"     solo .exe
                                    --select "data/**"   solo esa carpeta
                                    --select "1,3,5"     solo las entradas 1, 3 y 5
                                    --select required    omitir basura como .DS_Store
  --candidate <desplazamiento>    un archivo con varios ocultos: elegir cuál extraer (el número del escaneo)
  --pick <archivo>                elegir entradas en una lista a pantalla completa (espacio · a · Enter)
  --json                          emitir eventos y resultados como líneas JSON (para scripts)
  --no-smart-dir                  desactivar la «extracción inteligente»: por defecto, si hay una sola
                                  carpeta de primer nivel, se extrae directamente en el destino
  -q, --quiet                     mostrar solo el resultado (para scripts)
  --force saltar la comprobación de espacio en disco (si no alcanza, se rechaza el inicio)
  --test  Solo verificación: decodifica y comprueba sin escribir nada (para saber si el paquete está bien)
  --lang <idioma>                 cambiar el idioma (p. ej. zh-CN, en, ja, ko, ru)
  --show-config ver la configuración actual (dónde está el archivo y qué valores)
  --tail                          empaquetar «añadiendo al final» (por defecto: free atom; se usa solo si la portada es imagen/texto)
  --config <archivo>              usar este archivo de configuración
  --layout L1|L2|L4               diseño: L1 al final / L2 dentro de un free atom (por defecto) /
                                   L4 dentro del vídeo (se reproduce, pero solo 7-Zip y esta herramienta lo encuentran)
  --cover <archivo>               usar tu propia imagen/vídeo como portada
  --password-file <archivo>       lista de contraseñas (una por línea, # comentarios)
  --no-auto-password              no buscar contraseñas en notas ni en la lista
  --no-auto-password-notes        omitir solo la lectura de notas cercanas
  --no-auto-password-book         omitir solo probar tu propia lista de contraseñas
  --import-passwords <archivo>    importar una lista de contraseñas (una por línea, # inicia comentario; con tabulador se toma la 1ª columna, sin duplicados)
  -v, -vv, --verbose              salida detallada / depuración (-vv más detalle, con --log)
  --log <archivo>                 escribir un registro en archivo (para reportes)
  --no-color                      sin colores (para tuberías/registros)
  --keep                          conservar el ZIP intermedio al empaquetar
  --trash-source                  tras extraer, mover el archivo original a la papelera (recuperable)
  --delete-source                 tras extraer, borrar el archivo original definitivamente (no se puede deshacer; pregunta una vez y se niega si no es interactivo)
  --format <formato>              Empaquetar un archivo normal (sin portada): zip / tar.gz / tar.zst. Indicado = empaquetado normal; omitido = paquete camuflado
  --name <nombre>                 cambia el nombre del archivo de salida (p. ej. Película.2026.1080p.mp4); la carpeta se cambia con -o
  --tweak-time                    Evitar duplicados: aleatoriza las fechas de las entradas (distintas cada vez) para que la nube no lo tome como el mismo archivo; off por defecto
  --level 0-9                     nivel de compresión al empaquetar: 0 = sin comprimir (rápido), 9 = tamaño mínimo (por defecto 6)
  --sfx / --sfx-linux             empaquetar como archivo autoextraíble (.exe / .sh); no se puede con --split, --cover no hace falta, no se crea .说明.txt
  --decoy <N>                     Añadir N segmentos de datos señuelo (máx. 64, por defecto 0 = no)
  --decoy-size <tamaño>           Tamaño de cada segmento (4K–1M, por defecto 16K)
  --decoy-signatures              Poner una firma de archivo falsa en cada segmento (por defecto no)
  --caps                          mostrar la tabla de capacidades por formato (extraer / empaquetar / cifrado / volúmenes / reanudar)

EJEMPLOS:
  yshjy movie.mp4                 extraer el archivo escondido dentro de un vídeo
  yshjy downloads/                procesar todos los archivos de una carpeta (un fallo no detiene el resto)
  yshjy --list movie.mp4          ver qué contiene
  yshjy --select "*.exe" game.mp4 solo los .exe
  yshjy -p "clave" game.mp4       extraer con contraseña
  yshjy ys my-game/               empaquetar una carpeta en un vídeo camuflado
  yshjy --rescue broken.zip       rescatar de un archivo dañado
  yshjy --json pack.mp4 | jq .    para scripts o interfaces

¿No se abre? Prueba primero `yshjy --list` para ver si se reconoce el contenido.
"""

