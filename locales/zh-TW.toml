# 繁體中文 —— yshjy 語言包
#
# ══════════════════════════════════════════════════════════════
#  想加一種新語言？三個步驟，不用會寫程式：
#    ① 複製本檔，改名成語言代碼（如 fr-FR.toml）
#    ② 把 [meta] 的 code / name 改成你的語言
#    ③ 逐條把等號右邊的文字翻譯過去
#
#  只想改幾條？放一份 ~/.config/yshjy/locales/你的語言.toml，
#  裡面**只寫要覆蓋的條目**，其餘會自動用內建的。
#
#  注意：{name} 這種花括號是佔位符，翻譯時要原樣保留。
# ══════════════════════════════════════════════════════════════

[meta]
code = "zh-TW"
name = "繁體中文"
translators = "yshjy 專案"

[help]
text = """
楊三海解壓（yshjy） —— 專治「偽裝成影片/圖片的壓縮檔」

用法：
  yshjy <檔案>                    解壓縮（預設）
  yshjy jy <檔案>                 解壓縮（完整寫法，腳本推薦）
  yshjy ys <檔案或資料夾>          打包成偽裝檔
  yshjy --list <檔案>             先看看裡面有什麼（不解壓縮）
  yshjy --rescue <檔案>           檔案壞了也盡量救回來
  yshjy --extract-cover <檔案>    只把偽裝包裡的原版影片/圖片拿出來（不解壓）
  yshjy --help                    看這份說明
  yshjy --report <檔案>           產生診斷包（報障用；--no-paths 去識別路徑）
  --split <大小>                  打包時分卷（如 2G / 500M，也認純位元組數）
  --no-checksum                   不生成 .sha256 校驗和（預設生成）
  --no-readme                     不生成 .說明.txt（預設生成）
  --encoding <編碼>              手動指定檔名編碼（auto / gbk / big5 / sjis / utf-8；gb18030、shift-jis 是別名）
  yshjy -V, --version             看版本與版本檔次（常用版 / 全能版）

常用選項：
  -o, --dest <目錄>               解到哪（預設：壓縮檔所在目錄下的同名資料夾）
  -p, --password <密碼>           解壓縮密碼 / 打包密碼
  -j, --jobs <N>                  同時跑幾個（預設 1，依序最省磁碟）
  --select <條件>                 只解一部分：
                                    --select "*.exe"      只要 exe
                                    --select "遊戲資料/**" 只要某個目錄
                                    --select "1,3,5"      只要第 1、3、5 個
                                    --select required     跳過 .DS_Store 之類的垃圾
  --candidate <偏移>              一個檔案裡藏了好幾處時，指定解哪一處（偏移＝掃描結果裡那個數字）
  --pick <檔案>                   全螢幕勾選要解哪些（↑↓ 選 · 空格勾 · a 全選 · Enter 確認）
  --json                          逐行輸出事件流/結果（給腳本用）
  --no-smart-dir                  關掉「智慧解壓縮」：預設會看壓縮檔裡有沒有單一頂層目錄來決定
                                  要不要多套一層同名資料夾，加這個就永遠建同名資料夾
  -q, --quiet                     只輸出結果（腳本用）
  --force 跳過解壓前的磁碟空間預檢（空間不夠時會直接拒絕開始）
  --test  只測不寫：完整解碼 + 校驗，一個位元組都不落盤（查包完不完整用）
  --lang <語言>                   切換介面語言（如 en、ja、ko、ru、es）
  --show-config 看目前設定（設定檔在哪、各項現在是什麼值）
  --tail                          打包用「附加到檔尾」佈局（預設藏進 free 原子；封面是圖片/文字時自動用它）
  --config <檔案>                 用指定的設定檔（預設 ~/.config/yshjy/config.toml）
  --layout L1|L2|L4               打包佈局：L1 附加到檔尾 / L2 藏進 free 原子（預設）/
                                   L4 插在影片中間（影片還能播，但只有 7-Zip 和本工具認得出）
  --cover <檔案>                  用自己的圖片/影片當封面（預設用內建素材）
  --password-file <檔案>          密碼本：每行一個（# 註解），只對這次指令有效
  --no-auto-password              不自動從「說明.txt」和密碼本找解壓碼
  --no-auto-password-notes        只關「從說明.txt 抓解壓碼」這一檔
  --no-auto-password-book         只關「試自己的密碼本」這一檔
  --import-passwords <檔案>       匯入密碼本（每行一個解壓碼，# 開頭是註解；Tab 分隔取第一欄，自動去重）
  -v, -vv, --verbose              詳細 / 偵錯輸出（-vv 更詳細；配合 --log 排錯）
  --log <檔案>                    把日誌寫進檔案（報錯時發給開發者）
  --no-color                      不上色（管線 / 日誌友善）
  --keep                          打包時保留中間 ZIP（排錯用）
  --trash-source                  解完把原包移到資源回收筒（可還原）
  --delete-source                 解完永久刪除原包（無法還原；會先問一次，非互動直接拒絕）
  --format <格式>                 打包成一般封存檔（不加外殼）：zip / tar.gz / tar.zst。給了就是一般壓縮，不給還是偽裝包
  --name <名稱>                   改產物的檔名（偽裝成 電影.2026.1080p.mp4 這種）；只換名字不改位置，位置用 -o
  --tweak-time                    防炸鏈：把項目時間戳打亂（每次都不同），網盤就不會判成同一個檔案；預設關
  --level 0-9                     打包壓縮級別：0 = 僅儲存（最快），9 = 最小體積（預設 6）
  --sfx / --sfx-linux             打包成自解壓包（.exe / .sh），雙擊自己解開；不能與 --split 同用、不用 --cover，這種包不產生 .說明.txt
  --decoy <N>                     打包時撒 N 段干擾資料（最多 64 段，預設 0 = 不打）
  --decoy-size <大小>             每段多大（4K–1M，預設 16K）
  --decoy-signatures              每段裡夾一枚假特徵碼（騙掃描器；預設關）
  --caps                          看各格式的能力表（能解 / 能打包 / 加密 / 分卷 / 續傳）

範例：
  yshjy 魔女的侵襲.mp4            解開藏在影片裡的壓縮檔
  yshjy 下載/                     整個目錄的壓縮檔排隊解（一個壞了不影響其他）
  yshjy --list 電影.mp4           只看裡面有什麼
  yshjy --select "*.exe" 遊戲.mp4  只要裡面的 exe
  yshjy -p "解壓縮密碼" 遊戲.mp4   帶密碼解壓縮
  yshjy ys 我的遊戲/               把資料夾打包成偽裝影片
  yshjy --rescue 壞掉的.zip        檔案壞了也盡量救
  yshjy --json 包.mp4 | jq .       給腳本/前端使用

解不開？先試 yshjy --list 看能不能認出裡面有什麼。
"""

